<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozturksoft</title>
  <link rel="stylesheet" href="./src/style.css" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0d6efd">
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Ozturksoft",
    "url": "https://ozturksoft.net",
    "logo": "https://ozturksoft.net/favicon-32x32.png"
  }
  </script>
</head>
<body>
  <!-- Üst Menü -->
  <header>
    <div class="container header-flex">
      <a href="#home" class="logo-text">
        <img src="./public/images/logo.png" alt="Ozturksoft Logo" class="logo">
      </a>
      
      <!-- Hamburger Button -->
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <nav id="nav">
        <ul>
          <li><a href="#home">Ana Sayfa</a></li>
          <li><a href="#hakkimizda">Hakkımızda</a></li>
          <li><a href="#hizmetler">Hizmetler</a></li>
          <li><a href="#iletisim">İletişim</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Mobile Menu Overlay -->
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- İçerik buraya yüklenecek -->
  <main id="app"></main>

  <script type="module" src="./src/main.ts"></script>
  
  <script>
    // Hamburger menu toggle - Fixed version
    (function() {
      let menuOpen = false;
      
      function initMenu() {
        const hamburger = document.getElementById('hamburger');
        const nav = document.getElementById('nav');
        const overlay = document.getElementById('navOverlay');
        const navLinks = document.querySelectorAll('header nav ul li a');
        
        if (!hamburger || !nav || !overlay) return;
        
        function openMenu() {
          menuOpen = true;
          hamburger.classList.add('active');
          nav.classList.add('active');
          overlay.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
        
        function closeMenu() {
          menuOpen = false;
          hamburger.classList.remove('active');
          nav.classList.remove('active');
          overlay.classList.remove('active');
          document.body.style.overflow = '';
        }
        
        function toggleMenu(e) {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          
          if (menuOpen) {
            closeMenu();
          } else {
            openMenu();
          }
        }
        
        // Hamburger click
        hamburger.addEventListener('click', toggleMenu);
        
        // Overlay click
        overlay.addEventListener('click', function(e) {
          e.preventDefault();
          closeMenu();
        });
        
        // Nav links click
        navLinks.forEach(function(link) {
          link.addEventListener('click', function() {
            setTimeout(closeMenu, 150);
          });
        });
        
        // Window resize
        window.addEventListener('resize', function() {
          if (window.innerWidth > 768 && menuOpen) {
            closeMenu();
          }
        });
      }
      
      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMenu);
      } else {
        initMenu();
      }
    })();
    </script>
    <button id="scrollTopBtn" class="scroll-top-btn">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
    <path d="M12 4L12 20" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M5 11L12 4L19 11" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
</body>
</html>
